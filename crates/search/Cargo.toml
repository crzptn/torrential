[package]
name = "torrential-search"
description = "Searches torrent indexes and lawful catalogs, then merges and ranks the results"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
torrential-core = { path = "../core" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "time", "sync", "fs", "macros"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
url = "2"
